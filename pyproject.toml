[project]
name = "marketing-roi-causal-impact"
version = "0.1.0"
description = "End-to-end data pipeline and analytics project focused on donor Lifetime Value (LTV) and causal impact analysis of marketing campaigns. Built with Python (Poetry), dbt, and DuckDB."
authors = [
    {name = "robson-lachat",email = "robson.neves@gmail.com"}
]

requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1.3",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "statsmodels>=0.14.0",
    "pyarrow>=15.0.0",
    "ruff>=0.3.0"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
